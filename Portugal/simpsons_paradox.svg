rial">25.00%</text><text x="504" y="489" text-anchor="middle" font-family="Arial" font-size="17">≤ 105 km</text><rect x="699" y="202.85680000000002" width="53" height="257.1432" fill="#3068a6"/><text x="725.5" y="192.85680000000002" font-size="15" text-anchor="middle" font-family="Arial">32.14%</text><rect x="768" y="208.4536" width="53" height="251.5464" fill="#e89a3a"/><text x="794.5" y="198.4536" font-size="15" text-anchor="middle" font-family="Arial">31.44%</text><text x="759" y="489" text-anchor="middle" font-family="Arial" font-size="17">> 105 km</text><rect x="340" y="518" width="20" height="17" fill="#3068a6"/><text x="369" y="532" font-family="Arial" font-size="16">Control</text><rect x="490" y="518" width="20" height="17" fill="#e89a3a"/><text x="519" y="532" font-family="Arial" font-size="16">Treatment</text></svg>